<app-navbar />
<section class="page">
  <header>
    <h1>Gestión de mi refugio</h1>
  </header>

  <!-- ── Perfil del refugio ── -->
  <form class="editor perfil-form" (ngSubmit)="guardarPerfil()">
    <h2>Mi perfil de refugio</h2>

    <div class="perfil-grid">
      <div class="perfil-foto-col">
        <img [src]="perfil.foto || 'https://placehold.co/200x200?text=Refugio'" alt="Foto del refugio"
          class="perfil-foto-preview" />
        <input [(ngModel)]="perfil.foto" name="perfilFoto" placeholder="URL de la foto de perfil" />
      </div>

      <div class="perfil-datos-col">
        <input [(ngModel)]="perfil.nombre" name="perfilNombre" placeholder="Nombre del refugio" required />
        <input [(ngModel)]="perfil.telefono" name="perfilTelefono" placeholder="Teléfono de contacto" />
        <textarea [(ngModel)]="perfil.descripcion" name="perfilDescripcion" rows="6"
          placeholder="Descripción del refugio: a qué os dedicáis, vuestra historia, el equipo de personas que trabaja aquí, datos interesantes..."></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="guardandoPerfil">
        {{ guardandoPerfil ? 'Guardando...' : 'Guardar perfil' }}
      </button>
      <span class="ok-msg" *ngIf="perfilGuardado">✓ Perfil actualizado</span>
    </div>
  </form>

  <!-- ── Gestión de animales ── -->
  <form class="editor" (ngSubmit)="guardar()">
    <h2>{{ editandoId ? 'Editar animal' : 'Nuevo animal' }}</h2>

    <div class="grid-form">
      <input [(ngModel)]="form.nombre" name="nombre" placeholder="Nombre *" required />
      <input [(ngModel)]="form.especie" name="especie" placeholder="Especie *" required />
      <input [(ngModel)]="form.raza" name="raza" placeholder="Raza" />
      <input [(ngModel)]="form.edad" name="edad" type="number" placeholder="Edad (años)" />
      <input [(ngModel)]="form.genero" name="genero" placeholder="Género (Macho / Hembra)" />
      <input [(ngModel)]="form.estadoSalud" name="estadoSalud" placeholder="Estado de salud" />
      <input [(ngModel)]="form.ubicacion" name="ubicacion" placeholder="Ubicación" />
      <input [(ngModel)]="form.foto" name="foto" placeholder="URL de foto" />
      <select [(ngModel)]="form.estadoAdopcion" name="estadoAdopcion">
        <option value="DISPONIBLE">Disponible</option>
        <option value="EN_PROCESO">En proceso</option>
        <option value="ADOPTADO">Adoptado</option>
      </select>
    </div>

    <textarea [(ngModel)]="form.descripcion" name="descripcion"
      placeholder="Descripción del animal (carácter, historia, necesidades...)" rows="3"></textarea>

    <div class="actions">
      <button type="submit">{{ editandoId ? 'Guardar cambios' : 'Crear animal' }}</button>
      @if (editandoId) {
      <button type="button" class="secondary" (click)="cancelarEdicion()">Cancelar</button>
      }
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Especie</th>
          <th>Género</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let animal of animales">
          <td>{{ animal.nombre }}</td>
          <td>{{ animal.especie }}</td>
          <td>{{ animal.genero || '—' }}</td>
          <td>{{ animal.estadoAdopcion }}</td>
          <td>
            <button (click)="editar(animal)">Editar</button>
            <button class="danger" (click)="borrar(animal.id)">Borrar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
