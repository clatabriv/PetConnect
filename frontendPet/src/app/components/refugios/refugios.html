<app-navbar />
<section class="page">
  <header>
    <h1>Refugios disponibles</h1>
  </header>

  <div class="grid">
    <article *ngFor="let refugio of refugios" (click)="verDetalle(refugio.id)">
      <img [src]="refugio.foto || 'https://placehold.co/120x120?text=Sin+foto'" [alt]="refugio.nombre" />
      <div class="info">
        <h3>{{ refugio.nombre }}</h3>
        <p class="email">{{ refugio.email }}</p>
        <span class="badge">Refugio verificado</span>
      </div>
    </article>
  </div>
</section>

<app-scroll-to-top />
<app-footer />
