<app-navbar />
<section class="page">
    <header>
        <h1>Mi perfil</h1>
    </header>

    @if (usuario) {
    <form class="editor perfil-form" (ngSubmit)="guardar()">
        <h2>Mis datos</h2>

        <div class="perfil-grid">
            <div class="perfil-foto-col">
                <app-image-upload [urlActual]="form.foto" (imagenSubida)="form.foto = $event" />
            </div>

            <div class="perfil-datos-col">
                <label class="campo-label">Nombre</label>
                <input [(ngModel)]="form.nombre" name="nombre" placeholder="Tu nombre" required />

                <label class="campo-label">Email</label>
                <input [value]="usuario.email" disabled class="input-disabled" />

                <label class="campo-label">Rol</label>
                <input [value]="usuario.rol" disabled class="input-disabled" />

                <label class="campo-label">Ubicación</label>
                <input [(ngModel)]="form.ubicacion" name="ubicacion" placeholder="Tu ciudad (opcional)" />

                <label class="campo-label">Descripción</label>
                <textarea [(ngModel)]="form.descripcion" name="descripcion"
                    placeholder="Cuéntanos algo sobre ti (opcional)" rows="3"></textarea>
            </div>
        </div>

        <div class="actions">
            <button type="submit" [disabled]="guardando">
                {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
            </button>
            <span class="ok-msg" *ngIf="guardado">✓ Perfil actualizado</span>
        </div>
    </form>

    <!-- ── Zona de peligro ── -->
    <div class="editor zona-peligro">
        <h2>Eliminar cuenta</h2>
        <p class="aviso">
            Esta acción es <strong>irreversible</strong>. Tu cuenta y todos tus datos
            desaparecerán del sistema.
        </p>

        @if (!confirmandoBorrar) {
        <div class="actions">
            <button type="button" class="danger" (click)="solicitarBorrar()">
                Eliminar mi cuenta
            </button>
        </div>
        } @else {
        <div class="confirmar-box">
            <p class="aviso-confirmar">¿Estás seguro? Esta acción no se puede deshacer.</p>
            <div class="actions">
                <button type="button" class="danger" (click)="confirmarBorrar()">Sí, eliminar</button>
                <button type="button" class="secondary" (click)="cancelarBorrar()">Cancelar</button>
            </div>
        </div>
        }
    </div>
    }
</section>

<app-scroll-to-top />
<app-footer />
