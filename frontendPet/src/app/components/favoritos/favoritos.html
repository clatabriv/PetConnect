<section class="page">
  <header>
    <h1>Mis favoritos</h1>
    <a routerLink="/animales">Ver mas animales</a>
  </header>

  <div class="grid">
    <article *ngFor="let animal of favoritos">
      <img
        [src]="animal.foto || 'https://placehold.co/500x320?text=Sin+foto'"
        [alt]="animal.nombre"
      />
      <div>
        <h3>{{ animal.nombre }}</h3>
        <p>{{ animal.especie }} · {{ animal.ubicacion || 'Sin ubicacion' }}</p>
        <button (click)="quitarFavorito(animal.id)">Quitar de favoritos</button>
      </div>
    </article>
  </div>
</section>
